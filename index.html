<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mentora — An adaptive voice-first AI tutor that teaches, tests understanding, detects gaps, and verifies that learning actually happened.">
  <title>Mentora — Voice-First AI Tutor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full-viewport AI Core Canvas (background) -->
  <canvas id="living-core-canvas"></canvas>

  <!-- Global SVG Overlay for drawing glowing connections -->
  <svg id="global-svg-overlay"></svg>

  <!-- ═══════════════════════════════════════════
       TOP BAR — Minimal branding + drawer toggles
       ═══════════════════════════════════════════ -->
  <header class="top-bar">
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <button class="top-bar-icon" id="settings-toggle" aria-label="Open settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button class="top-bar-icon" id="history-toggle" aria-label="Open past sessions">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </button>
    </div>

    <div class="top-bar-brand">
      <h1 id="brand-name">MENTORA</h1>
    </div>

    <div class="top-bar-right" style="display: flex; align-items: center; gap: 0.75rem;">
      <div class="top-bar-progress" id="top-bar-progress" style="display: none;">
        <span class="progress-indicator-dot"></span>
        <span class="progress-text" id="progress-text">0% MASTERY</span>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
        </div>
      </div>
      <button class="top-bar-icon" id="roadmap-toggle" aria-label="Open learning roadmap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 20l-5-3V4l5 3 6-3 5 3v13l-5-3-6 3z"/>
          <line x1="9" x2="9" y1="4" y2="20"/>
          <line x1="15" x2="15" y1="1" y2="17"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════
       CENTER — State Label
       ═══════════════════════════════════════════ -->
  <div class="core-viewport">
    <div class="core-state-label" id="core-state-label">AWAITING CURIOSITY</div>
  </div>

  <!-- ═══════════════════════════════════════════
       BOTTOM — Transcript + Mic + Text input
       ═══════════════════════════════════════════ -->
  <div class="bottom-area">

    <!-- Floating transcript (last few messages) -->
    <div class="transcript-float" id="dialogue-stream">
      <!-- Messages populated dynamically -->
    </div>

    <!-- Mic Button (hero) -->
    <button class="mic-button mic-idle" id="mic-button" aria-label="Toggle microphone">
      <span class="mic-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </span>
      <span class="mic-ring"></span>
    </button>

    <!-- Text fallback row (small, beneath mic) -->
    <div class="text-row" id="conversation-controls" style="display: none;">
      <input type="text" id="text-input" class="text-row-input"
             placeholder="Type instead..."
             autocomplete="off" spellcheck="false">
      <button id="send-button" class="text-row-send" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       GOAL INPUT OVERLAY (shown at session start)
       ═══════════════════════════════════════════ -->
  <div class="goal-overlay" id="goal-section" style="display: none;">
    <div class="goal-card" id="goal-card">
      <div class="goal-card-title">What would you like to learn?</div>
      <div class="goal-card-input-row">
        <input type="text" id="goal-input" class="goal-card-input"
               placeholder="e.g. Neural Networks, TCP/IP, Economics..."
               autocomplete="off" spellcheck="false">
        <button id="goal-submit" class="goal-card-submit" aria-label="Submit goal">
          <span class="goal-submit-arrow">→</span>
          <span class="goal-submit-spinner" style="display: none;"></span>
        </button>
      </div>
      <div class="goal-card-status" id="goal-status" style="display: none;"></div>
      <div class="goal-card-hint" id="goal-hint">Or just tap the mic and tell me</div>
      <button class="goal-card-mic" id="goal-mic-btn" aria-label="Speak your goal">
        <span>🎤</span> Speak your goal
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SETTINGS DRAWER (slides from left)
       ═══════════════════════════════════════════ -->
  <div class="drawer drawer-left" id="settings-drawer">
    <div class="drawer-header">
      <span class="drawer-title">Settings</span>
      <button class="drawer-close" id="settings-close" aria-label="Close settings">&times;</button>
    </div>

    <div class="drawer-section">
      <label class="drawer-label">Accent</label>
      <select class="drawer-select" id="accent-select">
        <option value="all">All Accents</option>
      </select>
    </div>

    <div class="drawer-section">
      <label class="drawer-label">Voice</label>
      <select class="drawer-select" id="voice-select">
        <option value="">Default (British English)</option>
      </select>
      <button class="drawer-preview-btn" id="voice-test-btn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        <span>Test Voice Sample</span>
      </button>
    </div>

    <div class="drawer-section">
      <label class="drawer-label">Speech Speed</label>
      <div class="drawer-slider-row">
        <input type="range" id="speech-rate" class="drawer-slider" min="0.7" max="1.6" step="0.1" value="1.0">
        <span class="drawer-slider-value" id="speech-rate-value">1.0×</span>
      </div>
    </div>

    <div class="drawer-section">
      <label class="drawer-label">
        <input type="checkbox" id="auto-listen-toggle" checked>
        Auto-listen after response
      </label>
    </div>

    <div class="drawer-section">
      <label class="drawer-label">
        <input type="checkbox" id="show-transcript-toggle" checked>
        Show transcript
      </label>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       HISTORY DRAWER (slides from left)
       ═══════════════════════════════════════════ -->
  <div class="drawer drawer-left" id="history-drawer">
    <div class="drawer-header">
      <span class="drawer-title">Memory</span>
      <button class="drawer-close" id="history-close" aria-label="Close history">&times;</button>
    </div>
    
    <div class="history-list" id="history-list">
      <div class="history-empty">Loading memory...</div>
    </div>
    
    <div class="drawer-plan" style="margin-top: auto; padding-top: 1rem;">
      <button id="clear-history-btn" class="demo-btn" style="width: 100%; border-color: rgba(239, 68, 68, 0.4); color: #ef4444;">Clear All Memory</button>
    </div>
  </div>


  <!-- ═══════════════════════════════════════════
       ROADMAP DRAWER (slides from right)
       ═══════════════════════════════════════════ -->
  <div class="drawer drawer-right" id="roadmap-drawer">
    <div class="drawer-header">
      <button class="drawer-close" id="roadmap-close" aria-label="Close roadmap">&times;</button>
      <span class="drawer-title">Learning Roadmap</span>
    </div>

    <!-- Understanding Percentage -->
    <div class="drawer-understanding">
      <span class="drawer-understanding-label">UNDERSTANDING</span>
      <span class="drawer-understanding-pct" id="understanding-pct">—</span>
    </div>

    <div class="drawer-topic" id="roadmap-topic">NEURAL NETWORKS</div>

    <div class="drawer-roadmap-container">
      <svg id="roadmap-svg-overlay" width="100%" height="100%"></svg>
      <div class="roadmap-nodes-list" id="roadmap-nodes-list">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Learning Plan Section -->
    <div class="drawer-plan">
      <div class="drawer-plan-header">LEARNING PLAN</div>
      <div class="drawer-plan-content" id="learning-plan-content">
        <span style="color: #555;">No active plan</span>
      </div>
    </div>
  </div>

  <!-- Drawer backdrop overlay -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <!-- Session Summary Overlay -->
  <div class="summary-overlay" id="summary-overlay"></div>

  <!-- Demo Controls (only visible in ?demo=1 mode) -->
  <div class="demo-controls" id="demo-controls" style="display: none;">
    <button onclick="window.appState.goToStep(Math.max(0, window.appState.currentStepIndex - 1))" class="demo-btn">‹ Prev</button>
    <span class="demo-step-counter" id="demo-step-counter">Step 0</span>
    <button onclick="window.appState.goToStep(window.appState.currentStepIndex + 1)" class="demo-btn">Next ›</button>
  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="voice.js"></script>
  <script src="mentor.js"></script>
  <script src="app.js"></script>

</body>
</html>
